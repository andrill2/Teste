<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teste</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --primary: #38bdf8;
        --text: #e5e7eb;
        --muted: #94a3b8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, var(--bg), #1e293b);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .card {
        width: min(720px, 90vw);
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 18px;
        padding: 2rem;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
      }
      h1 {
        margin-top: 0;
        color: var(--primary);
        font-size: clamp(2rem, 4vw, 3rem);
      }
      p {
        color: var(--muted);
        line-height: 1.7;
      }
      .badge {
        display: inline-block;
        background: rgba(56, 189, 248, 0.15);
        color: var(--primary);
        border: 1px solid rgba(56, 189, 248, 0.35);
        border-radius: 999px;
        padding: 0.45rem 0.8rem;
        font-weight: bold;
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">GitHub Pages</div>
      <h1>Teste</h1>
      <p>Esta página foi publicada com GitHub Pages a partir do repositório <strong>andrill2/Teste</strong>.</p>
      <p>O ambiente está pronto para receber conteúdos estáticos, como HTML, CSS e JavaScript.</p>
    </main>
  </body>
</html>
